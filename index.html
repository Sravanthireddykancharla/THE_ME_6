<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hiranya AI — Smart Lead Generation & Sales Pipeline</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF5A3C;
      --primary-dark: #E04326;
      --primary-light: #FFF1EE;
      --dark: #0F172A;
      --slate: #475569;
      --muted: #64748B;
      --border: #E2E8F0;
      --bg: #FAFAFA;
      --white: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--dark);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 76px; }
    .brand {
      font-size: 1.45rem; font-weight: 800; color: var(--dark);
      text-decoration: none; display: flex; align-items: center; gap: 10px;
    }
    .brand-dot {
      width: 12px; height: 12px; background: var(--primary);
      border-radius: 50%; display: inline-block; box-shadow: 0 0 0 4px var(--primary-light);
    }
    .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; }
    .nav-links a, .nav-links button {
      background: none; border: none; font-family: inherit;
      font-size: 0.95rem; font-weight: 600; color: var(--slate);
      text-decoration: none; cursor: pointer;
    }
    .nav-links a:hover, .nav-links button:hover { color: var(--primary); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: inherit; font-weight: 700; font-size: 0.95rem;
      padding: 12px 22px; border-radius: 10px; border: none; cursor: pointer;
      transition: all 0.2s ease; text-decoration: none;
    }
    .btn-primary {
      background: var(--primary); color: var(--white);
      box-shadow: 0 8px 20px -6px rgba(255, 90, 60, 0.55);
    }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-secondary { background: var(--white); color: var(--dark); border: 1.5px solid var(--border); }
    .btn-secondary:hover { border-color: var(--dark); background: #F8FAFC; }

    /* Hero */
    .hero { padding: 72px 0 96px; background: radial-gradient(circle at 85% 20%, #FFF1EE 0%, transparent 45%); }
    .hero-grid { display: grid; grid-template-columns: 1.12fr 0.88fr; gap: 48px; align-items: center; }
    .hero-badge {
      display: inline-flex; align-items: center; background: var(--primary-light);
      color: var(--primary-dark); font-weight: 700; font-size: 0.8rem;
      padding: 6px 14px; border-radius: 999px; margin-bottom: 20px; text-transform: uppercase;
    }
    .hero h1 { font-size: clamp(2.1rem, 4vw, 3.2rem); font-weight: 800; line-height: 1.15; margin-bottom: 20px; }
    .hero p.sub-headline { font-size: 1.1rem; color: var(--slate); margin-bottom: 32px; max-width: 580px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 40px; }
    .hero-actions .btn { padding: 15px 26px; font-size: 1rem; }

    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
      padding-top: 28px; border-top: 1px solid var(--border);
    }
    .stat-item strong { display: block; font-size: 1.12rem; font-weight: 800; color: var(--dark); margin-bottom: 4px; }
    .stat-item span { font-size: 0.92rem; color: var(--muted); display: block; }

    /* Pipeline Card */
    .pipeline-card {
      background: var(--white); border: 1px solid var(--border); border-radius: 20px;
      padding: 28px; box-shadow: 0 24px 50px -12px rgba(15, 23, 42, 0.08);
    }
    .pipeline-header {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 18px; margin-bottom: 20px; border-bottom: 1px solid var(--border);
    }
    .pipeline-title { font-size: 0.85rem; font-weight: 800; letter-spacing: 0.08em; }
    .live-indicator {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem;
      font-weight: 700; color: #16A34A; background: #DCFCE7; padding: 4px 10px; border-radius: 999px;
    }
    .stage-list { display: flex; flex-direction: column; gap: 14px; }
    .stage-item {
      background: #F8FAFC; border: 1px solid var(--border); border-radius: 14px;
      padding: 16px 18px; transition: all 0.2s ease;
    }
    .stage-item:hover { border-color: var(--primary); background: var(--white); transform: translateX(4px); }
    .stage-tag {
      display: inline-block; font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
      color: var(--primary); background: var(--primary-light); padding: 3px 9px; border-radius: 6px; margin-bottom: 6px;
    }
    .stage-item h3 { font-size: 0.98rem; font-weight: 700; margin-bottom: 4px; }
    .stage-item p { font-size: 0.88rem; color: var(--slate); }

    footer {
      border-top: 1px solid var(--border); padding: 32px 0;
      background: var(--white); text-align: center; color: var(--muted); font-size: 0.9rem;
    }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(5px); display: none; align-items: center;
      justify-content: center; padding: 20px; z-index: 1000; overflow-y: auto;
    }
    .modal-overlay.active { display: flex; }
    .modal-close {
      position: absolute; top: 16px; right: 16px; width: 36px; height: 36px;
      border-radius: 50%; border: 1px solid var(--border); background: var(--white);
      font-size: 1.25rem; font-weight: 700; cursor: pointer; z-index: 10;
    }

    .modal-1-box {
      background: var(--white); border-radius: 22px; max-width: 980px; width: 100%;
      overflow: hidden; display: grid; grid-template-columns: 0.92fr 1.08fr;
      position: relative; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25); margin: auto;
    }
    .modal-1-left {
      background: linear-gradient(145deg, #FF5A3C 0%, #E04326 100%);
      color: var(--white); padding: 40px 34px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .modal-1-tag {
      font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em;
      background: rgba(255, 255, 255, 0.2); display: inline-block; padding: 5px 12px; border-radius: 6px; margin-bottom: 16px;
    }
    .modal-1-left h2 { font-size: 1.7rem; font-weight: 800; line-height: 1.25; margin-bottom: 16px; }
    .modal-1-left p.body-copy { font-size: 0.95rem; color: rgba(255, 255, 255, 0.92); margin-bottom: 24px; }
    .badge-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .benefit-badge { background: rgba(255, 255, 255, 0.16); padding: 9px 14px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; }
    .whatsapp-btn {
      display: flex; align-items: center; justify-content: center; background: #25D366; color: #FFFFFF;
      font-weight: 700; font-size: 0.95rem; padding: 13px 18px; border-radius: 10px;
      text-decoration: none; margin-bottom: 20px;
    }
    .contact-info { border-top: 1px solid rgba(255, 255, 255, 0.25); padding-top: 16px; font-size: 0.86rem; }

    .modal-1-right { padding: 40px 36px; background: var(--white); }
    .modal-1-right h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; padding-right: 28px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { display: block; font-size: 0.83rem; font-weight: 700; margin-bottom: 6px; }
    .form-group input, .form-group select {
      width: 100%; padding: 11px 13px; border: 1.5px solid var(--border);
      border-radius: 9px; font-family: inherit; font-size: 0.92rem;
    }
    .form-submit { width: 100%; padding: 14px; font-size: 1rem; margin-top: 6px; }
    .success-msg {
      display: none; background: #DCFCE7; color: #166534; padding: 14px;
      border-radius: 10px; font-weight: 600; font-size: 0.92rem; margin-top: 14px; text-align: center;
    }

    .modal-2-box {
      background: var(--white); border-radius: 22px; max-width: 720px; width: 100%;
      padding: 40px 36px; position: relative; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25); margin: auto;
    }
    .modal-2-tag {
      font-size: 0.78rem; font-weight: 800; color: var(--primary);
      background: var(--primary-light); display: inline-block; padding: 5px 12px; border-radius: 6px; margin-bottom: 12px;
    }
    .modal-2-box h2 { font-size: 1.65rem; font-weight: 800; margin-bottom: 24px; padding-right: 28px; }
    .steps-container { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
    .step-card { border: 1px solid var(--border); background: #F8FAFC; border-radius: 14px; padding: 16px 20px; }
    .step-card h4 { font-size: 1rem; font-weight: 800; margin-bottom: 4px; }
    .step-card h4 span { color: var(--primary); }
    .step-card p { font-size: 0.92rem; color: var(--slate); }

    @media (max-width: 900px) {
      .hero-grid, .modal-1-box { grid-template-columns: 1fr; }
      .nav-links { display: none; }
    }
    @media (max-width: 560px) {
      .form-grid, .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
